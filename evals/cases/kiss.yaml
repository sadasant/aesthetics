- id: kiss-structure-shallow
  kind: directory
  target: pkg
  use: [kiss]
  files:
    pkg/parse.go: "package pkg\n"
    pkg/render.go: "package pkg\n"
    pkg/parse_test.go: "package pkg\n"
    pkg/README.md: "# pkg\n\nParses and renders templates.\n"
  expect:
    kiss/shallow-structure: pass

