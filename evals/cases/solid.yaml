# SOLID: single responsibility, open/closed, substitutability, interface
# segregation, dependency inversion, cohesive packages.

- id: solid-srp-focused
  kind: file
  target: src/PasswordHasher.ts
  use: [solid]
  files:
    src/PasswordHasher.ts: |
      import { scrypt, randomBytes, timingSafeEqual } from "node:crypto";
      import { promisify } from "node:util";

      const scryptAsync = promisify(scrypt);

      /** Hashes and verifies passwords with scrypt. */
      export class PasswordHasher {
        async hash(password: string): Promise<string> {
          const salt = randomBytes(16);
          const key = (await scryptAsync(password, salt, 32)) as Buffer;
          return `${salt.toString("hex")}:${key.toString("hex")}`;
        }

        async verify(password: string, stored: string): Promise<boolean> {
          const [salt, key] = stored.split(":").map((h) => Buffer.from(h, "hex"));
          const candidate = (await scryptAsync(password, salt, 32)) as Buffer;
          return timingSafeEqual(key, candidate);
        }
      }
  expect:
    solid/single-responsibility: pass
    solid/depend-on-abstractions: borderline

