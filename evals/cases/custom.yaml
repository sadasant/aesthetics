- id: attribution-introduced-clever-code
  kind: diff
  target: stats.py
  use: [kiss]
  before:
    stats.py: |
      def average(values):
          return sum(values) / len(values)
  files:
    stats.py: |
      from functools import reduce


      def average(values):
          return sum(values) / len(values)


      median = lambda v: (lambda o, m: o[m] if len(o) & 1 else sum(o[~-m:-~m]) / 2)(sorted(v), len(v) >> 1)
  expect:
    kiss/direct: fail
  attribution:
    kiss/direct: introduced

- id: attribution-preexisting-clever-code
  kind: diff
  target: stats.py
  use: [kiss]
  before:
    stats.py: |
      from functools import reduce


      def average(values):
          return sum(values) / len(values)


      median = lambda v: (lambda o, m: o[m] if len(o) & 1 else sum(o[~-m:-~m]) / 2)(sorted(v), len(v) >> 1)
  files:
    stats.py: |
      from functools import reduce


      def average(values):
          """Return the arithmetic mean of values."""
          return sum(values) / len(values)


      median = lambda v: (lambda o, m: o[m] if len(o) & 1 else sum(o[~-m:-~m]) / 2)(sorted(v), len(v) >> 1)
  expect:
    kiss/direct: fail
  attribution:
    kiss/direct: preexisting

