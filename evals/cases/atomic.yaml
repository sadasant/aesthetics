- id: atomic-sprawling-change
  kind: diff
  use: [atomic]
  before:
    app.py: |
      def main():
          print("hello")
  files:
    app.py: |
      import argparse
      import json
      import logging
      import sqlite3


      def main():
          parser = argparse.ArgumentParser()
          parser.add_argument("--export", action="store_true")
          parser.add_argument("--import-file")
          parser.add_argument("--verbose", action="store_true")
          args = parser.parse_args()
          logging.basicConfig(level=logging.DEBUG if args.verbose else logging.INFO)
          db = sqlite3.connect("app.db")
          db.execute("CREATE TABLE IF NOT EXISTS notes (id INTEGER PRIMARY KEY, body TEXT)")
          if args.import_file:
              with open(args.import_file) as f:
                  for note in json.load(f):
                      db.execute("INSERT INTO notes (body) VALUES (?)", (note,))
              db.commit()
          if args.export:
              print(json.dumps([r[0] for r in db.execute("SELECT body FROM notes")]))
    themes.py: |
      THEMES = {"dark": {"bg": "#000", "fg": "#fff"}, "light": {"bg": "#fff", "fg": "#000"}}


      def theme(name):
          return THEMES.get(name, THEMES["light"])
    telemetry.py: |
      import time
      import urllib.request


      def ping(event):
          urllib.request.urlopen(f"https://telemetry.example.com/e?name={event}&t={time.time()}")
  expect:
    atomic/reviewable: fail
    atomic/single-purpose: fail
