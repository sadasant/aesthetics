- id: atomic-inconsistent-style
  kind: diff
  use: [atomic]
  before:
    inventory.py: |
      class Inventory:
          def __init__(self):
              self._items = {}

          def add_item(self, name, count=1):
              if count <= 0:
                  raise ValueError("count must be positive")
              self._items[name] = self._items.get(name, 0) + count

          def remove_item(self, name, count=1):
              if self._items.get(name, 0) < count:
                  raise ValueError(f"not enough {name}")
              self._items[name] -= count
  files:
    inventory.py: |
