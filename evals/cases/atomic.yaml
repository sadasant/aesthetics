# Atomic changes: one purpose, no unrelated edits, self-contained,
# consistent with the surrounding code, reviewable.

- id: atomic-focused-fix
  kind: diff
  use: [atomic]
  before:
    cart.py: |
      def total(items):
          return sum(item["price"] for item in items)
    test_cart.py: |
      from cart import total


      def test_total():
          assert total([{"price": 2}, {"price": 3}]) == 5
  files:
    cart.py: |
      def total(items):
          return sum(item["price"] * item.get("quantity", 1) for item in items)
    test_cart.py: |
      from cart import total


      def test_total():
          assert total([{"price": 2}, {"price": 3}]) == 5


      def test_total_counts_quantity():
          assert total([{"price": 2, "quantity": 3}]) == 6
  expect:
    atomic/single-purpose: pass
    atomic/no-unrelated-modifications: pass
    atomic/self-contained: pass
    atomic/consistent-with-surroundings: pass
    atomic/reviewable: pass

- id: atomic-mixed-purposes
  kind: diff
  use: [atomic]
  before:
    cart.py: |
      def total(items):
          return sum(item["price"] for item in items)
    users.py: |
      def full_name(u):
          return u["first"] + " " + u["last"]
    README.md: |
      # Shop

      A tiny shop.
  files:
    cart.py: |
      def total(items):
          return sum(item["price"] * item.get("quantity", 1) for item in items)


      def apply_coupon(total, code):
          return total * 0.9 if code == "SAVE10" else total
    users.py: |
      def display_name(user):
          return f'{user["first"]} {user["last"]}'.strip()


      def is_admin(user):
          return user.get("role") == "admin"
    README.md: |
      # Shop

      A tiny shop. Now with coupons, admin roles, and quantity support!
  expect:
    atomic/single-purpose: fail
    atomic/no-unrelated-modifications: fail
    atomic/reviewable: fail

- id: atomic-drive-by-reformat
  kind: diff
  use: [atomic]
  before:
    server.js: |
      const express = require('express')
      const app = express()

      app.get('/health', (req, res) => res.send('ok'))

      app.listen(3000)
    db.js: |
      const { Pool } = require('pg')
      const pool = new Pool({ connectionString: process.env.DATABASE_URL })
      module.exports = { query: (text, params) => pool.query(text, params) }
  files:
    server.js: |
      const express = require('express')
      const app = express()

      app.get('/health', (req, res) => res.send('ok'))
      app.get('/version', (req, res) => res.send(process.env.APP_VERSION || 'dev'))

      app.listen(3000)
    db.js: |
      const { Pool } = require("pg");

      const pool = new Pool({
        connectionString: process.env.DATABASE_URL,
      });

      module.exports = {
        query: (sql, values) => pool.query(sql, values),
      };
  expect:
    atomic/no-unrelated-modifications: fail
    atomic/single-purpose: borderline

