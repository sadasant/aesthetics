# Unix philosophy: focused responsibilities, simple interfaces, composability,
# minimal mechanism, thin entry points, deliberate module surfaces.

- id: unix-do-one-thing-focused
  kind: file
  target: slug/slug.go
  use: [unix]
  files:
    slug/slug.go: |
      // Package slug converts titles into URL-safe identifiers.
      package slug

      import (
      	"strings"
      	"unicode"
      )

      // Make lowercases s and joins its words with hyphens, dropping punctuation.
      func Make(s string) string {
      	var words []string
      	for _, w := range strings.FieldsFunc(s, isSeparator) {
      		words = append(words, strings.ToLower(w))
      	}
      	return strings.Join(words, "-")
      }

      func isSeparator(r rune) bool {
      	return !unicode.IsLetter(r) && !unicode.IsDigit(r)
      }
  expect:
    unix/do-one-thing: pass
    unix/simple-interfaces: pass
    unix/composable: pass
    unix/minimal-mechanism: pass

- id: unix-do-one-thing-mixed
  kind: file
  target: app/handlers.py
  use: [unix]
  files:
    app/handlers.py: |
      import smtplib
      import sqlite3
      import sys
      import json
      from http.server import BaseHTTPRequestHandler

      DB = sqlite3.connect("/var/lib/app/prod.db")
      SMTP = smtplib.SMTP("mail.internal", 25)
      CURRENT_USER = None


      class Handler(BaseHTTPRequestHandler):
          def do_POST(self):
              global CURRENT_USER
              body = json.loads(self.rfile.read(int(self.headers["Content-Length"])))
              CURRENT_USER = body["user"]
              DB.execute("INSERT INTO orders VALUES (?, ?)", (body["user"], body["item"]))
              DB.commit()
              send_receipt(body["user"], body["item"])
              print("order stored for", CURRENT_USER)
              self.send_response(201)
              self.end_headers()


      def send_receipt(user, item):
          SMTP.sendmail("shop@example.com", user, f"Thanks for buying {item}")


      def render_invoice_html(order):
          return "<html><body><h1>Invoice</h1>" + str(order) + "</body></html>"


      def migrate():
          DB.execute("CREATE TABLE IF NOT EXISTS orders (user TEXT, item TEXT)")


      def parse_cli():
          if "--migrate" in sys.argv:
              migrate()
              sys.exit(0)


      def monthly_report():
          rows = DB.execute("SELECT user, COUNT(*) FROM orders GROUP BY user").fetchall()
          for user, count in rows:
              print(user, count)
          sys.exit(0)
  expect:
    unix/do-one-thing: fail
    unix/simple-interfaces: fail
    unix/composable: fail
  evidence:
    unix/simple-interfaces: [7, 9]

- id: unix-composable-reader
  kind: file
  target: wordcount/count.go
  use: [unix]
  files:
    wordcount/count.go: |
      // Package wordcount counts words in text streams.
      package wordcount

      import (
      	"bufio"
      	"io"
      )

      // Count returns the number of whitespace-separated words read from r.
      func Count(r io.Reader) (int, error) {
      	sc := bufio.NewScanner(r)
      	sc.Split(bufio.ScanWords)
      	n := 0
      	for sc.Scan() {
      		n++
      	}
      	return n, sc.Err()
      }
  expect:
    unix/composable: pass
    unix/simple-interfaces: pass

