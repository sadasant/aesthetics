- id: unix-repository-clear
  kind: repository
  use: [unix]
  files:
    README.md: |
      # mdlint

      A linter for Markdown files.

      - `cmd/mdlint`: the command-line entry point
      - `internal/parse`: parses Markdown into blocks
      - `internal/rules`: the lint rules
      - `internal/report`: formats findings
    cmd/mdlint/main.go: "package main\n\nfunc main() {}\n"
    internal/parse/parse.go: "// Package parse turns Markdown into blocks.\npackage parse\n"
    internal/rules/rules.go: "// Package rules defines lint rules over parsed blocks.\npackage rules\n"
    internal/report/report.go: "// Package report formats findings for terminals and CI.\npackage report\n"
  expect:
    unix/clear-boundaries: pass

