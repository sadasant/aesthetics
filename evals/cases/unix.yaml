- id: unix-entry-point-borderline
  kind: file
  target: cmd/serve/main.go
  use: [unix]
  files:
    cmd/serve/main.go: |
      package main

      import (
      	"flag"
      	"log"
      	"net/http"
      	"time"

      	"example.com/app/internal/api"
      	"example.com/app/internal/store"
      )

      func main() {
      	addr := flag.String("addr", ":8080", "listen address")
      	dsn := flag.String("db", "app.db", "database file")
      	flag.Parse()
      	db, err := store.Open(*dsn)
      	if err != nil {
      		log.Fatal(err)
      	}
      	mux := http.NewServeMux()
      	mux.Handle("/api/", api.New(db))
      	mux.HandleFunc("/healthz", func(w http.ResponseWriter, r *http.Request) {
      		if err := db.Ping(); err != nil {
      			http.Error(w, "db down", http.StatusServiceUnavailable)
      			return
      		}
      		w.Write([]byte("ok"))
      	})
      	srv := &http.Server{Addr: *addr, Handler: mux, ReadTimeout: 10 * time.Second}
      	log.Fatal(srv.ListenAndServe())
      }
  expect:
    unix/thin-entry-point: borderline

