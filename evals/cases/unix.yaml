- id: unix-minimal-mechanism-plugin-system
  kind: file
  target: greet/greet.ts
  use: [unix]
  files:
    greet/greet.ts: |
      // Greets the user.
      type GreeterPlugin = { name: string; priority: number; greet(n: string): string };

      class PluginRegistry {
        private plugins = new Map<string, GreeterPlugin>();
        private hooks: Array<(p: GreeterPlugin) => GreeterPlugin> = [];
        register(p: GreeterPlugin) { this.plugins.set(p.name, this.hooks.reduce((acc, h) => h(acc), p)); }
        addHook(h: (p: GreeterPlugin) => GreeterPlugin) { this.hooks.push(h); }
        resolve(config: { strategy: "priority" | "name"; fallback?: string }): GreeterPlugin {
          const all = [...this.plugins.values()];
          const sorted = config.strategy === "priority" ? all.sort((a, b) => b.priority - a.priority) : all.sort((a, b) => a.name.localeCompare(b.name));
          return sorted[0] ?? this.plugins.get(config.fallback ?? "default")!;
        }
      }

      class GreeterFactory {
        constructor(private registry: PluginRegistry, private config: { strategy: "priority" | "name" }) {}
        create() { return this.registry.resolve(this.config); }
      }

      const registry = new PluginRegistry();
      registry.register({ name: "default", priority: 0, greet: (n) => `Hello, ${n}!` });

      export function greet(name: string): string {
        return new GreeterFactory(registry, { strategy: "priority" }).create().greet(name);
      }
  expect:
    unix/minimal-mechanism: fail

- id: unix-thin-entry-point
  kind: file
  target: cmd/fetch/main.go
  use: [unix]
  files:
    cmd/fetch/main.go: |
      // Command fetch downloads a URL to a file.
      package main

      import (
      	"flag"
      	"fmt"
      	"os"

      	"example.com/fetch/internal/download"
      )

      func main() {
      	out := flag.String("o", "", "output file")
      	flag.Parse()
      	if flag.NArg() != 1 || *out == "" {
      		fmt.Fprintln(os.Stderr, "usage: fetch -o FILE URL")
      		os.Exit(2)
      	}
      	if err := download.ToFile(flag.Arg(0), *out); err != nil {
      		fmt.Fprintln(os.Stderr, "fetch:", err)
      		os.Exit(1)
      	}
      }
  expect:
    unix/thin-entry-point: pass

- id: unix-fat-entry-point
  kind: file
  target: main.go
  use: [unix]
  files:
    main.go: |
      package main

      import (
      	"encoding/csv"
      	"fmt"
      	"math"
      	"os"
      	"sort"
      	"strconv"
      )

      func main() {
      	f, err := os.Open(os.Args[1])
      	if err != nil {
      		panic(err)
      	}
      	rows, err := csv.NewReader(f).ReadAll()
      	if err != nil {
      		panic(err)
      	}
      	totals := map[string]float64{}
      	counts := map[string]int{}
      	for i, r := range rows {
      		if i == 0 {
      			continue
      		}
      		amount, err := strconv.ParseFloat(r[2], 64)
      		if err != nil {
      			continue
      		}
      		if r[3] == "refund" {
      			amount = -amount
      		}
      		if r[1] == "EUR" {
      			amount *= 1.08
      		} else if r[1] == "GBP" {
      			amount *= 1.27
      		}
      		totals[r[0]] += amount
      		counts[r[0]]++
      	}
      	var names []string
      	for n := range totals {
      		names = append(names, n)
      	}
      	sort.Slice(names, func(i, j int) bool { return totals[names[i]] > totals[names[j]] })
      	for _, n := range names {
      		avg := totals[n] / float64(counts[n])
      		tax := math.Round(totals[n]*0.21*100) / 100
      		fmt.Printf("%-20s total=%10.2f avg=%8.2f tax=%8.2f\n", n, totals[n], avg, tax)
      	}
      }
  expect:
    unix/thin-entry-point: fail
  evidence:
    unix/thin-entry-point: [21, 45]

