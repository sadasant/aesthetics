- id: unix-directory-focused
  kind: directory
  target: internal/money
  use: [unix]
  files:
    internal/money/money.go: |
      // Package money represents monetary amounts in minor units.
      package money

      type Amount struct {
      	Cents    int64
      	Currency string
      }
    internal/money/format.go: |
      package money

      import "fmt"

      // String formats the amount like "12.34 EUR".
      func (a Amount) String() string {
      	return fmt.Sprintf("%d.%02d %s", a.Cents/100, a.Cents%100, a.Currency)
      }
    internal/money/add.go: |
      package money

      import "errors"

      var ErrCurrencyMismatch = errors.New("currency mismatch")

      // Add sums two amounts of the same currency.
      func Add(a, b Amount) (Amount, error) {
      	if a.Currency != b.Currency {
      		return Amount{}, ErrCurrencyMismatch
      	}
      	return Amount{a.Cents + b.Cents, a.Currency}, nil
      }
  expect:
    unix/focused-directories: pass

