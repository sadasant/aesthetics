- id: readme-wall-of-text
  kind: file
  target: README.md
  use: [readme]
  files:
    README.md: |
      # dataflow

      ## License
      Apache-2.0

      dataflow started in 2019 when our team needed something to move data between systems and we tried many tools, Airflow, Luigi, cron scripts, and some homegrown things, none of which quite fit, so over a long weekend I wrote the first prototype, which then grew, and today it handles thousands of jobs, although the architecture has changed many times, first a single process, then a queue, then workers, then back to a single process for small installs, which is why some of the code looks the way it does, and if you look at the history you will see the migration to the new scheduler which took most of 2021 and involved rewriting the storage layer twice.

      ## Random tips
      Set DATAFLOW_HOME. Sometimes restart helps.

      ## Usage
      Run it.
  expect:
    readme/conventional-structure: fail
    readme/usage: fail
    readme/orientation: fail

