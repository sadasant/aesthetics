- id: readme-repository-present
  kind: repository
  use: [readme]
  files:
    README.md: |
      # tinyq

      A minimal persistent job queue for Go programs.

      ## Install

      ```sh
      go get example.com/tinyq
      ```

      ## Usage

      ```go
      q, _ := tinyq.Open("jobs.db")
      q.Push("send-email", payload)
      ```
    queue.go: "package tinyq\n"
  expect:
    readme/repository-has-readme: pass

