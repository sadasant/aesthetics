# Standard Readme: purpose, installation, usage, orientation, structure.

- id: readme-standard
  kind: file
  target: README.md
  use: [readme]
  files:
    README.md: |
      # slugify

      Convert any string into a URL-safe slug. Useful for blog URLs, file names, and IDs that must stay readable.

      ## Install

      Requires Node.js 18 or newer.

      ```sh
      npm install @acme/slugify
      ```

      ## Usage

      ```js
      import { slugify } from "@acme/slugify";

      slugify("Hello, World!"); // "hello-world"
      ```

      See the [API reference](docs/api.md) for all options.

      ## Contributing

      Issues and pull requests are welcome; see [CONTRIBUTING.md](CONTRIBUTING.md).

      ## License

      MIT © Acme
  expect:
    readme/states-purpose: pass
    readme/installation: pass
    readme/usage: pass
    readme/orientation: pass
    readme/conventional-structure: pass

