version: 2

project_name: aesthetics

builds:
  - main: ./cmd/aesthetics
    binary: aesthetics
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/sadasant/aesthetics/internal/cli.Version={{ .Version }}

archives:
  # Version-free names keep the "latest" download URLs stable for install.sh.
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
